# This repository is a Home Assistant HACS custom component, not a published
# Python package. The SHMÚ client library is vendored under
# custom_components/shmu/shmu_opendata/ (kept HA-free so it stays swappable).
# This file only holds dev-tooling configuration.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",  # first with target-version py314
    # Exact pin: ty is pre-1.0 and its releases add and change rules, so an
    # upgrade could fail the gate with no code change. Bump it on purpose.
    "ty==0.0.109",
    "pytest-homeassistant-custom-component",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "ANN"]
# ty does not flag missing annotations, so ruff enforces them in the vendored
# library. An explicit `Any` is a deliberate choice, so it stays allowed.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"!custom_components/shmu/shmu_opendata/**" = ["ANN"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# Type-check only the vendored library. Its imports are all relative, so ty
# never needs the HA-dependent custom_components.shmu package to resolve it.
include = ["custom_components/shmu/shmu_opendata"]

[tool.ty.rules]
# Off by default. They stop an `Any` from leaking into a typed value and
# reject bare generics such as `dict` or `list`.
unsound-assignment = "error"
unsound-return = "error"
unsound-yield = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"

[tool.ty.terminal]
error-on-warning = true
